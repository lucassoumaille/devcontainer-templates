name: ${templateOption:projectName}
description: A new Flutter application.
publish_to: 'none'

# build-name+build-number: versionName/versionCode on Android, CFBundleShortVersionString/CFBundleVersion on iOS.
# Increase the build number for every store upload.
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
